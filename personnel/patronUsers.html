

{% block content %}
<!-- Chart.js and jQuery (Ensure jQuery is loaded in base or here) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="container-fluid py-4">
    
    <!-- . UPLOAD SECTION (ambot kung ako ni ipadayon) -->

        <div class="card-body p-4">

                    <h5 class="fw-bold"><i class="bi bi-file-earmark-excel me-2"></i>Bulk Import</h5>
                    <p class="text-muted small mb-0">Upload .xlsx or .xls files to add multiple patrons at once.</p>
                </div>
                <div class="col-md-6">
                    <form action="{{url_for('personnel.upload_students')}}" method="POST" enctype="multipart/form-data" class="d-flex gap-2">
                        <input type="file" name="file" class="form-control form-control-sm" accept=".xlsx, .xls" required>
                        <button class="btn btn-primary btn-sm px-4" type="submit">Upload</button>
                    </form>
                </div>
            </div>
        </div>
    </div> -->
    <!-- 1. HEADER & SEARCH SECTION -->
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="display-6 fw-bold text-success">
                <i class="bi bi-people-fill me-2"></i> Patron Management
            </h2>
            <p class="text-muted">Search for patrons to view details or manage accounts.</p>
        </div>
        <div class="col-md-6 mx-auto">
            <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-success"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="patronSearch" 
                       placeholder="Type name, ID, or email...">
            </div>
            <div id="searchLoader" class="text-center mt-2" style="display: none;">
                <div class="spinner-border spinner-border-sm text-success" role="status"></div>
            </div>
        </div>
    </div>

    <!-- 2. ANALYTICS SECTION (Chart) -->
    <div class="row mb-5">
        <div class="col-lg-8 mx-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                    <h5 class="fw-bold mb-0" style="color: var(--cmu-dark-green);">
                        <i class="bi bi-pie-chart-fill me-2"></i>College Distribution
                    </h5>
                </div>
                <div class="card-body">
                    <div style="max-height: 300px; position: relative;">
                        <canvas id="patronDistributionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-5 opacity-25">

    <!-- 3. DYNAMIC SEARCH RESULTS AREA -->
    <div id="searchResultsSection" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="text-dark fw-bold mb-0">Search Results</h4>
            <span class="badge bg-success" id="resultCount">0 Found</span>
        </div>
        <div id="resultsContainer" class="row g-3">
            <!-- AJAX Results Inject Here -->
        </div>
    </div>

    
</div>

<!-- Edit Modal Placeholder (Template) -->
<div id="modalContainer"></div>

<!-- Status Toast/Modal -->
<div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center p-4" id="statusModalBody"></div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    const searchInput = $('#patronSearch');
    const resultsContainer = $('#resultsContainer');
    const resultsSection = $('#searchResultsSection');
    const loader = $('#searchLoader');

    // 1. CHART INITIALIZATION
    $.get('/personnel/api/patron_stats', function(data) {
        const ctx = document.getElementById('patronDistributionChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut', // Doughnut looks more modern than Pie
            data: {
                labels: data.labels,
                datasets: [{
                    data: data.data,
                    backgroundColor: ['#198754', '#ffc107', '#0dcaf0', '#6610f2', '#fd7e14', '#20c997'],
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right' }
                }
            }
        });
    });

    // 2. LIVE SEARCH LOGIC
    let debounceTimer;
    searchInput.on('input', function() {
        clearTimeout(debounceTimer);
        const term = $(this).val();

        if (term.length < 2) {
            resultsSection.fadeOut();
            return;
        }

        loader.show();
        debounceTimer = setTimeout(() => {
            $.get('/personnel/api/search_patrons', { term: term }, function(data) {
                loader.hide();
                resultsContainer.empty();
                $('#resultCount').text(data.length + " Found");
                
                if (data.length > 0) {
                    data.forEach(patron => {
                        const card = `
                        <div class="col-md-6 col-xl-4">
                            <div class="card h-100 border-0 shadow-sm patron-card">
                                <div class="card-body">
                                    <div class="d-flex align-items-center mb-3">
                                        <img src="${patron.profile_picture || 'https://placehold.co/50x50?text=P'}" 
                                             class="rounded-circle me-3 border" width="50" height="50">
                                        <div>
                                            <h6 class="mb-0 fw-bold">${patron.full_name}</h6>
                                            <small class="text-muted">${patron.email}</small>
                                        </div>
                                    </div>
                                    <div class="bg-light p-2 rounded-3 mb-3">
                                        <div class="d-flex justify-content-between small">
                                            <span class="text-muted">Username:</span>
                                            <span class="fw-bold">${patron.username}</span>
                                        </div>
                                        <div class="d-flex justify-content-between small mt-1">
                                            <span class="text-muted">College:</span>
                                            <span>${patron.college || 'N/A'}</span>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-outline-success btn-sm w-100" onclick="editPatron(${patron.id})">
                                            <i class="bi bi-pencil"></i> Manage
                                        </button>
                                        <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete(${patron.id}, '${patron.full_name}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                        resultsContainer.append(card);
                    });
                    resultsSection.fadeIn();
                } else {
                    resultsContainer.html('<div class="col-12 text-center p-5 text-muted">No results found.</div>');
                    resultsSection.fadeIn();
                }
            });
        }, 300);
    });
});

// Helper for managing/editing (would load a modal via AJAX or route)
function editPatron(id) {
    // Logic to open your edit modal
    $(`#editModal${id}`).modal('show');
}
</script>

<style>
    .patron-card {
        transition: transform 0.2s, box-shadow 0.2s;
        border-radius: 15px;
    }
    .patron-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
    .bg-subtle { background-color: #f8f9fa; }
    #patronSearch { border-radius: 0 12px 12px 0; }
    .input-group-text { border-radius: 12px 0 0 12px; }
</style>
{% endblock %}
